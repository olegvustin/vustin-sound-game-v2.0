ba(255,220,145,.16),0 12px 34px rgba(215,169,77,.28);\n}\n#vustin-producer-native .flow-hint{\n  margin:14px 0 0;\n  text-align:center;\n  font-size:12px;\n  opacity:.68;\n}\n#vustin-producer-native .release-choice{\n  border-color:rgba(215,169,77,.42);\n}\n#vustin-producer-native .release-action{\n  margin-top:12px;\n  padding-top:10px;\n  border-top:1px solid rgba(215,169,77,.20);\n  color:var(--gold2);\n  font-weight:900;\n  letter-spacing:.4px;\n}\n@media(max-width:620px){\n  #vustin-producer-native .nav{bottom:6px;padding:8px;margin-left:-8px;margin-right:-8px}\n  #vustin-producer-native .nav .btn:not(.alt){order:-1}\n}\n\n\n\n\n\n\n/* Standalone iframe: legacy Tilda offsets must not pull the app above the viewport.\n   This empty compatibility marker precedes .app; keep it in normal flow. */\n#vustin-producer-native{\n  margin-top:0 !important;\n  position:relative;\n  z-index:5;\n}\n\n\n/* v9.1 — Mobile Edition: compact game-like flow, minimal vertical scrolling */\n@media(max-width:640px){\n  html{scroll-behavior:smooth}\n  body{overscroll-behavior-y:contain}\n\n  .app{\n    padding:5px 7px calc(92px + env(safe-area-inset-bottom)) !important;\n  }\n  .top{\n    margin-bottom:6px !important;\n    padding:6px 8px !important;\n    min-height:46px;\n    border-radius:13px !important;\n  }\n  .brand{font-size:9px !important;letter-spacing:1px !important}\n  .brand:before{width:28px !important;height:28px !important;flex-basis:28px !important}\n  .money{font-size:10px !important;padding:7px 9px !important}\n\n  .panel{\n    padding:12px 11px 18px !important;\n    border-radius:17px !important;\n    min-height:0 !important;\n  }\n  .scene-head{\n    margin:0 0 8px !important;\n    padding:6px 8px !important;\n    min-height:34px;\n  }\n  .scene-place{font-size:8px !important}\n  .kicker{font-size:8px !important;letter-spacing:1.5px !important}\n  .section-title{\n    font-size:25px !important;\n    margin:4px 0 9px !important;\n    line-height:1 !important;\n  }\n
