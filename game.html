<script>
let currentPreview=null;
let primedPreview=null;

function previewSrcForSong(song){
 if(!song)return null;
 if(song.preview)return song.preview+(song.preview.includes('?')?'&':'?')+'v=13.10';
 return null;
}
function stopRealPreview(){
 const audios=[currentPreview,primedPreview].filter(Boolean);
 audios.forEach(a=>{try{a.pause();a.currentTime=0}catch(e){}});
 currentPreview=null;primedPreview=null;
}
function primeReleasePreview(){
 if(!soundOn||!state.song)return;
 const src=previewSrcForSong(state.song);
 if(!src)return;
 try{
  if(primedPreview){try{primedPreview.pause()}catch(e){}}
  const a=new Audio(src);
  a.preload='auto';
  a.volume=0.001;
  a.currentTime=0;
  primedPreview=a;
  const promise=a.play();
  if(promise&&promise.then){
   promise.then(()=>{
    try{a.pause();a.currentTime=0;a.volume=.78}catch(e){}
   }).catch(()=>{});
  }
 }catch(e){}
}
function playRealPreview(){
 if(!soundOn||!state.song)return;
 const src=previewSrcForSong(state.song);
 if(!src)return;
 try{
  let a=primedPreview;
  if(!a || !a.src || a.src.indexOf(state.song.preview)===-1){
   a=new Audio(src);a.preload='auto';
  }
  currentPreview=a;primedPreview=null;
  currentPreview.currentTime=0;
  currentPreview.volume=.78;
  const promise=currentPreview.play();
  if(promise&&promise.catch){
   promise.catch(()=>{
    // Fallback: show an explicit user-gesture play control if the browser blocks delayed playback.
    const host=document.querySelector('.now-playing');
    if(host)host.innerHTML=`<button type="button" class="btn" style="padding:10px 16px" onclick="playRealPreview()">▶ СЛУШАТЬ ФРАГМЕНТ</button>`;
   });
  }
 }catch(e){}
}



let demoPreview=null,demoButton=null;
function stopSongDemo(){
 if(demoPreview){try{demoPreview.pause();demoPreview.currentTime=0}catch(e){}demoPreview=null}
 if(demoButton){demoButton.textContent='▶ ПОСЛУШАТЬ ПЕСНЮ';demoButton.classList.remove('playing');demoButton=null}
}
function playSongDemo(ev,id,btn){
 if(ev){ev.stopPropagation();ev.preventDefault()}
 const song=songs.find(x=>x.id===id); if(!song||!song.preview)return;
 if(demoPreview&&demoButton===btn){stopSongDemo();return}
 stopSongDemo(); stopRealPreview();
 try{
  demoButton=btn;btn.textContent='■ ОСТАНОВИТЬ';btn.classList.add('playing');
  demoPreview=new Audio(song.preview+(song.preview.includes('?')?'&':'?')+'v=13.19');
  demoPreview.volume=.78;
  demoPreview.addEventListener('ended',stopSongDemo,{once:true});
  demoPreview.play().catch(()=>{stopSongDemo();toast('Нажми ещё раз, чтобы включить демо')});
 }catch(e){stopSongDemo()}
}
let soundOn=true,audioCtx=null;
function ac(){
 if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
 return audioCtx;
}
function tone(freq=440,dur=.08,type='sine',gain=.025,delay=0){
 if(!soundOn)return;
 try{
  let c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
 }catch(e){}
}
function uiClick(){tone(620,.045,'sine',.012)}
function countdownSound(n){tone(n===1?660:440,.12,'sine',.035);tone(n===1?990:660,.10,'sine',.015,.03)}
function launchSound(){tone(220,.35,'sawtooth',.022);tone(440,.45,'sine',.025,.08);tone(880,.55,'sine',.018,.15)}
function successSound(){tone(523,.22,'sine',.02);tone(659,.22,'sine',.018,.12);tone(784,.34,'sine',.018,.24)}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇';if(!soundOn)stopRealPreview();if(soundOn)uiClick()}
document.addEventListener('click',e=>{if(soundOn&&e.target.closest('.btn,.choice,.card')&&!e.target.closest('#soundToggle'))uiClick()},{capture:true});

function productionReview(s,promoIdx,score,income,profit){
 const good=[],waste=[],better=[], p=s.p;
 const label={v:'короткие видео',vis:'клип / визуал',pl:'плейлисты',radio:'радио',talk:'PR / медиа',q:'таргет'};
 const ranked=promoIdx.map(i=>[i,p[promos[i][2]]]).sort((x,y)=>y[1]-x[1]);

 if(ranked.length&&ranked[0][1]>=75)good.push(`${promos[ranked[0][0]][0]} хорошо совпали с характером песни и получили усиленный коммерческий эффект.`);
 if((state.industryScore||0)>=5)good.push(`Решение в событии «${state.industryTitle}» заметно усилило релиз.`);
 if(score>=80)good.push('Производство, упаковка и продвижение сложились в сильную комбинацию.');
 if(profit>0)good.push(`Релиз вернул вложения и заработал ${fmt(profit)} VS₽ сверх затрат.`);
 if(!good.length)good.push('Релиз состоялся, но ни один фактор не дал выраженного преимущества.');

 ranked.filter(x=>x[1]<65).slice(0,2).forEach(x=>waste.push(`${promos[x[0]][0]} слабо подходят этой песне — такой бюджет почти не создаёт дополнительного охвата.`));
 if((state.industryScore||0)<0)waste.push(`Решение в событии «${state.industryTitle}» снизило потенциал запуска.`);
 if(profit<0&&state.spent>7000)waste.push('Высокий бюджет не окупился: дорогой запуск сам по себе не гарантирует результат.');
 if(!waste.length)waste.push('Явно провальных расходов в этой кампании не обнаружено.');

 const all=promos.map((x,i)=>[i,p[x[2]]]).sort((x,y)=>y[1]-x[1]);
 const unused=all.find(x=>x[1]>=78&&!promoIdx.includes(x[0]));
 if(unused)better.push(`Можно было протестировать ${promos[unused[0]][0]}: потенциал песни здесь ${unused[1]}/100.`);
 if(p.q>=86&&state.studio?.[0]!=='Топ-студия')better.push('Песня чувствительна к качеству записи — более сильная студия могла помочь.');
 if(p.vis>=90&&!promoIdx.includes(0))better.push('У песни очень высокий визуальный потенциал — клип мог стать ключевым активом.');
 if(p.long>=90)better.push('У песни высокий потенциал долгой жизни: полезна стратегия не только на первую неделю.');
 if(!better.length)better.push('Следующий шаг — сохранить сильные решения и точечно проверить другой канал продвижения.');
 return {good:good.slice(0,3),waste:waste.slice(0,3),better:better.slice(0,3)};
}

/* v10.0 — living catalog and delayed returns */
function advanceCatalog(){
 if(!career.history||!career.history.length){career.lastCatalog=null;return}
 let addStreams=0,addIncome=0,addListeners=0,revivals=[];
 career.history.forEach((h,i)=>{
   let age=Math.max(1,career.releases-i);
   let base=(h.catalogBase||Math.round((h.streams||0)*.075));
   let decay=Math.max(.18,1-age*.075);
   let video=(h.videoTail||0);
   let pr=(h.prTail||0);
   let playlist=(h.playlistTail||0),radio=(h.radioTail||0);
   let tail=base*decay*(1+video*.38+pr*.22+playlist*.28+radio*.20);
   let revival=false;
   // rare deterministic-feeling catalog revival: strong long-life songs are much more likely
   let long=h.long||60;
   if(long>=82 && Math.random()<.16){tail*=2.1;revival=true}
   let st=Math.max(0,Math.round(tail));
   let inc=Math.round(280*Math.pow(Math.max(st,500)/5000,.76));
   let lis=Math.round(st*(.004+long/25000));
   addStreams+=st;addIncome+=inc;addListeners+=lis;
   h.catalogStreams=(h.catalogStreams||0)+st;
   h.catalogIncome=(h.catalogIncome||0)+inc;
   if(revival)revivals.push({song:h.song,streams:st});
 });
 career.cash+=addIncome;
 career.listeners+=addListeners;
 career.catalogIncome=(career.catalogIncome||0)+addIncome;
 career.catalogStreams=(career.catalogStreams||0)+addStreams;
 career.lastCatalog={streams:addStreams,income:addIncome,listeners:addListeners,revivals};
}

const forceMajeurePool=[
 {kind:'bad',title:'Алгоритмы охладели',text:'Рекомендательные системы дали песне меньше показов, чем ожидалось.',stream:.76,income:.94,rep:0},
 {kind:'bad',title:'Реклама дала дорогой трафик',text:'Кампания привела много случайных переходов, но слабую конверсию в слушателей.',stream:.84,income:.91,rep:0},
 {kind:'bad',title:'Плейлист снял трек',text:'Редактор изменил подборку раньше ожидаемого.',stream:.80,income:.95,rep:0},
 {kind:'bad',title:'Клип задержался',text:'Видео вышло позже основного импульса релиза.',stream:.86,income:.96,rep:0},
 {kind:'good',title:'Органический всплеск',text:'Слушатели начали самостоятельно делиться песней.',stream:1.28,income:1.12,rep:1},
 {kind:'good',title:'Пользовательское видео',text:'Неожиданный ролик с песней начал набирать просмотры.',stream:1.35,income:1.10,rep:1},
 {kind:'good',title:'Неожиданная поддержка радио',text:'Ведущий поставил песню вне запланированной ротации.',stream:1.22,income:1.10,rep:1}
];
function rollForceMajeure(){
 let r=Math.random();
 // Most releases are normal; negative surprises are deliberately more common than jackpots.
 if(r<.24)return forceMajeurePool[Math.floor(Math.random()*4)];
 if(r<.36)return forceMajeurePool[4+Math.floor(Math.random()*3)];
 return {kind:'neutral',title:'Без форс-мажоров',text:'Релиз прошёл примерно по плану.',stream:1,income:1,rep:0};
}
function riskFactorForSpend(){
 // Overspending raises execution complexity and makes bad ROI possible.
 let x=Math.max(0,(state.spent-9000)/16000);
 return Math.min(.18,x*.18);
}

function calculateRelease(){
 let s=state.song,p=s.p,notes=[];
 let quality=Math.min(100,p.q*.55+(state.studio?.[2]||0)+(state.arr?.[2]||0)*.7+(state.team.includes(0)?8:0));
 let weighted=[],weights=[1,.85,.65,.4,.3];
 state.promo.forEach(idx=>{
   let pr=promos[idx],val=p[pr[2]];
   if(state.team.includes(2)&&idx===0)val=Math.min(100,val+12);
   if(idx===0)val=Math.min(100,val+career.videoLvl*5);
   if(state.team.includes(3)&&idx===1)val=Math.min(100,val+12);
   if(state.team.includes(4)&&idx===4)val=Math.min(100,val+12);
   if(idx!==0)val=Math.min(100,val+career.marketingLvl*3);
   weighted.push([val,pr[0]]);
 });
 weighted.sort((x,y)=>y[0]-x[0]);
 let denom=weighted.reduce((a,_,i)=>a+(weights[i]||.25),0);
 let fit=weighted.length?weighted.reduce((a,x,i)=>a+x[0]*(weights[i]||.25),0)/denom:30;
 weighted.forEach(x=>notes.push([x[0]>=85?'Сильное решение':x[0]>=70?'Хорошее решение':'Слабое решение',`${x[1]}: соответствие песне ${x[0]}/100.`]));

 let market=state.promo.includes(1)?82:65;
 let industry=Math.max(-10,Math.min(10,state.industryScore||0));
 let activeTrend=ensureTrend();
 let trendVal=p[activeTrend.key]||0;
 let trendBoost=trendVal>=80?7:trendVal>=65?4:trendVal>=50?2:0;
 industry+=trendBoost;
 let repBoost=Math.min(85,50+career.rep);
 let score=Math.max(20,Math.min(97,.30*quality+.30*fit+.15*((p.e+p.talk)/2)+.10*market+.05*repBoost+industry));

 let ranges=score<40?[2000,15000]:score<55?[15000,40000]:score<70?[40000,100000]:score<80?[100000,250000]:score<90?[250000,700000]:[700000,1400000];
 let lo=score<40?20:score<55?40:score<70?55:score<80?70:score<90?80:90,span=score<40?20:score<80?15:10;
 let streams=(ranges[0]+(ranges[1]-ranges[0])*((score-lo)/span))*(.9+Math.random()*.2);

 // v9.8: money works only when it matches the song.
 // Expensive channels can now pay back on the right material, but remain wasteful on a poor fit.
 const channelPower=[.42,.26,.24,.30,.28,.22]; // clip, reels, playlists, radio, PR, target
 let activation=0;
 state.promo.forEach(idx=>{
   let val=p[promos[idx][2]];
   if(state.team.includes(2)&&idx===0)val=Math.min(100,val+12);
   if(idx===0)val=Math.min(100,val+career.videoLvl*5);
   if(state.team.includes(3)&&idx===1)val=Math.min(100,val+12);
   if(state.team.includes(4)&&idx===4)val=Math.min(100,val+12);
   if(idx!==0)val=Math.min(100,val+career.marketingLvl*3);
   let match=Math.max(0,Math.min(1,(val-55)/45));
   activation+=channelPower[idx]*match*match;
 });
 // diminishing returns stop “buy everything” from becoming the dominant strategy
 activation=Math.min(.48,activation/(1+Math.max(0,state.promo.length-1)*.30));
 let productionLift=1+Math.max(0,quality-72)/420;
 let overspendRisk=riskFactorForSpend();
 let execution=.88+Math.random()*.22-overspendRisk*Math.random();
 streams=Math.max(1000,Math.round(streams*(1+activation+(state.delayedBoost||0)+(state.playlistExtra||0))*productionLift*execution));
 state.forceResult=rollForceMajeure();
 streams=Math.max(1000,Math.round(streams*state.forceResult.stream));
 if(state.goal==='hit')streams=Math.round(streams*1.10);

 // Strong production and song longevity create a larger permanent audience.
 let catalogFactor=1+Math.max(0,quality-72)/180+Math.max(0,p.long-75)/260;
 let loyal=Math.round(streams*(.018+p.e/6000+p.long/9000)*catalogFactor*(state.goal==='fans'?1.28:1));

 // Less concave revenue curve: a successful large release can now justify a major campaign.
 let gross=Math.round(820*Math.pow(Math.max(streams,1000)/10000,0.74)*(state.goal==='profit'?1.15:1));
 gross=Math.round(gross*(state.forceResult?state.forceResult.income:1));
 let partner=Math.round(gross*(state.contract||0)),income=gross-partner;
 let repGain=score>=90?6:score>=82?5:score>=74?4:score>=66?3:score>=58?2:score>=48?1:0;
 if(state.goal==='rep'&&score>=66)repGain+=1;
 repGain+=(state.industryRep||0); repGain=Math.max(-2,repGain);

 career.cash+=income;career.listeners+=loyal;career.rep=Math.max(0,career.rep+repGain);career.releases++;career.week++;

 let missed=promos.map((x,i)=>[x,i,p[x[2]]]).filter(x=>!state.promo.includes(x[1])).sort((x,y)=>y[2]-x[2])[0];
 if(missed)notes.push(['Упущенная возможность',`${missed[0][0]} имел потенциал ${missed[2]}/100.`]);
 let dna=songDNA(s);
 notes.unshift(['ДНК песни',`Сильные стороны: ${dna.top.map(x=>x[0]).join(', ')}. Слабее: ${dna.weak.map(x=>x[0]).join(', ')}.`]);
 if(state.industryTitle)notes.unshift(['Событие индустрии',`${state.industryTitle}: ${state.industryDecision}.`]);
 let goalName=(goals.find(g=>g[0]===state.goal)||[])[1]||'—';
 notes.unshift(['Цель релиза',`${goalName}: стратегия учтена в итоговом результате.`]);

 let profit=income-state.spent;
 let producerReview=productionReview(s,state.promo,score,income,profit);
 advanceCatalog();
 let videoTail=state.promo.includes(0)?Math.max(0,(p.vis-60)/40):0;
 let prTail=state.promo.includes(4)?Math.max(0,(p.talk-60)/40):0;
 let radioTail=state.radioTail||0;
 let playlistTail=(state.promo.includes(2)?Math.max(0,(p.pl-60)/40):0)+(state.playlistExtra||0);
 advanceTrend();
 career.history.unshift({song:s.name,songId:s.id,spent:state.spent,streams,income,profit,loyal,score,repGain,
   long:p.long||60,catalogBase:Math.round(streams*(.055+(p.long||60)/2200)),
   videoTail,prTail,playlistTail,radioTail,dilemma:state.dilemmaResult||null,force:state.forceResult||null,catalogStreams:0,catalogIncome:0});
 setTimeout(animateReleaseCounter,80);
 showRelease(streams,loyal,income,partner,score,repGain,notes,profit,producerReview);
}

let fxTimer=null;
function gameFeel(title,text){
 let el=document.getElementById('fxToast');if(!el)return;
 el.querySelector('b').textContent=title;el.querySelector('span').textContent=text||'';
 el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
 clearTimeout(fxTimer);fxTimer=setTimeout(()=>el.classList.remove('show'),2100);
}
function pulsePanel(){let p=document.querySelector('.panel');if(p){p.classList.remove('fx-pulse');void p.offsetWidth;p.classList.add('fx-pulse')}}

const SAVE_KEY='vustin_producer_career_v1'; let saveTimer=null;
function saveCareer(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,savedAt:Date.now(),career}));
 let el=document.getElementById('saveIndicator');if(el){el.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>el.classList.remove('show'),1200)}return true}catch(e){return false}
}
function loadCareer(){
 try{let raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;let d=JSON.parse(raw);if(!d||!d.career)return false;
 career=Object.assign({cash:10000,listeners:0,rep:0,releases:0,history:[],week:1,studioLvl:0,marketingLvl:0,videoLvl:0,teamLvl:0,catalogIncome:0,catalogStreams:0,lastCatalog:null,trend:null,trendWeeks:0},d.career);return true}catch(e){return false}
}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function deleteSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function newCareerConfirmed(){
 if(hasSave()&&!confirm('Начать новую карьеру? Сохранённый прогресс будет удалён.'))return;
 deleteSave();career={cash:10000,listeners:0,rep:0,releases:0,history:[],week:1,studioLvl:0,marketingLvl:0,videoLvl:0,teamLvl:0,catalogIncome:0,catalogStreams:0,lastCatalog:null,trend:null,trendWeeks:0};
 resetRelease();saveCareer();careerScreen();
}

};

body:before{content:"";position:fixed;inset:0;z-index:-3;background:
linear-gradient(90deg,rgba(4,13,20,.96),rgba(4,13,20,.72) 48%,rgba(4,13,20,.82)),
url("https://olegvustin.github.io/vustin-sound-game-v2.0/image-01.webp") center/cover no-repeat;filter:saturate(.82)}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:
radial-gradient(circle at 78% 15%,rgba(221,176,91,.14),transparent 24%),
radial-gradient(circle at 12% 70%,rgba(75,139,145,.18),transparent 30%)}
.app{max-width:1180px;margin:auto;padding:22px 28px 44px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding:10px 0}
.brand{display:flex;align-items:center;gap:13px;font-weight:800;letter-spacing:1.8px;font-size:13px}.brand:before{content:"";width:42px;height:42px;background:url("https://olegvustin.github.io/vustin-sound-game-v2.0/image-02.webp") center/contain no-repeat;filter:drop-shadow(0 5px 14px #0008)}
.money{color:var(--gold2);font-weight:900;padding:10px 16px;border:1px solid rgba(221,176,91,.35);border-radius:999px;background:rgba(7,19,29,.72);backdrop-filter:blur(10px)}
.panel{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(11,32,45,.94),rgba(7,21,31,.91));border:1px solid rgba(174,194,205,.18);border-radius:28px;padding:34px;box-shadow:0 28px 90px #0009, inset 0 1px 0 #ffffff0d;backdrop-filter:blur(15px);min-height:560px}
.panel:before{content:"";position:absolute;right:-120px;top:-130px;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(221,176,91,.11),transparent 67%);pointer-events:none}
.kicker{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2.4px;text-transform:uppercase}
.hero{min-height:485px;display:flex;flex-direction:column;justify-content:center;max-width:720px;position:relative}
.hero:after{content:"";position:absolute;right:-330px;top:40px;width:265px;height:265px;border-radius:50%;background:
radial-gradient(circle at center,#ddb05b 0 5%,#12232d 5.5% 21%,#0a0d10 21.5% 100%);
box-shadow:0 30px 80px #000c;animation:spin 12s linear infinite;opacity:.95}
.hero h1{font-family:Georgia,serif;font-size:clamp(44px,7vw,78px);line-height:.98;margin:14px 0 18px;letter-spacing:-2px}
.hero p{max-width:660px;color:var(--pale);font-size:19px}
.btn{border:0;border-radius:16px;padding:15px 22px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#07131d;font-weight:900;cursor:pointer;font-size:14px;letter-spacing:.3px;box-shadow:0 8px 26px rgba(221,176,91,.16);transition:.22s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 34px rgba(221,176,91,.28)}.btn.alt{background:rgba(8,25,36,.6);color:var(--white);border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;border:1px solid var(--line);background:linear-gradient(155deg,rgba(12,35,49,.95),rgba(7,23,33,.95));border-radius:20px;padding:20px;cursor:pointer;transition:.25s;overflow:hidden}.card:after{content:"♪";position:absolute;right:14px;top:7px;font-size:44px;color:#ffffff08}.card:hover,.card.sel{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 38px #0007}.card.sel:before{content:"ВЫБРАНО";position:absolute;right:12px;bottom:12px;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:1.3px}.card h3{font-family:Georgia,serif;font-size:24px;margin:7px 0 9px}.desc{color:var(--muted);font-size:14px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#123447;color:var(--pale);font-size:11px;margin:7px 3px 0 0;border:1px solid #24495c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:linear-gradient(180deg,#0a202d,#081923);border:1px solid var(--line);border-radius:17px;padding:15px;text-align:center}.stat b{display:block;font-size:24px;color:var(--gold2);margin-bottom:3px}
.section-title{font-family:Georgia,serif;font-size:34px;margin:7px 0 20px}.market{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.market div{padding:18px;border-radius:18px;background:linear-gradient(155deg,#0c2635,#081a25);border:1px solid var(--line);min-height:100px}.market b{font-size:21px}.up{color:var(--good)}.down{color:var(--bad)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,#0c2635,#081a25);cursor:pointer;transition:.2s;min-height:105px}.choice:hover{transform:translateY(-2px);border-color:#50758a}.choice.sel{border-color:var(--gold);background:linear-gradient(155deg,#173a48,#0c2734);box-shadow:inset 0 0 0 1px #ddb05b33}.price{color:var(--gold2);font-weight:900;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.event{border-left:4px solid var(--gold);padding:22px;background:linear-gradient(90deg,#102b39,#0a1b26);border-radius:0 20px 20px 0;box-shadow:0 16px 40px #0004}
.release{text-align:center;padding:12px 30px 24px}.vinyl{width:205px;height:205px;border-radius:50%;margin:8px auto 24px;background:repeating-radial-gradient(circle,#111 0 4px,#202020 5px 7px);display:grid;place-items:center;animation:spin 2.4s linear infinite;box-shadow:0 28px 65px #000c,0 0 0 1px #ffffff12}.vinyl:after{content:"";width:88px;height:88px;border-radius:50%;background:#ddb05b url("https://olegvustin.github.io/vustin-sound-game-v2.0/image-03.webp") center/74% no-repeat;display:block;box-shadow:0 0 0 2px #0e3753}
@keyframes spin{to{transform:rotate(360deg)}}.big-number{font-family:Georgia,serif;font-size:clamp(50px,8vw,92px);line-height:1;font-weight:700;color:var(--gold2);text-shadow:0 10px 35px #0008}.analysis{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.note{padding:15px;border-radius:16px;background:#0a1b26;border:1px solid var(--line)}.note b{color:var(--pale)}.hidden{display:none!important}.small{font-size:13px;color:var(--muted)}
.wave{height:44px;margin:18px 0;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.7}.wave i{display:block;width:3px;border-radius:9px;background:linear-gradient(var(--gold),var(--teal));animation:pulse 1.15s ease-in-out infinite}.wave i:nth-child(3n){animation-delay:.18s}.wave i:nth-child(4n){animation-delay:.36s}@keyframes pulse{0%,100%{height:8px}50%{height:38px}}
.progressline{height:4px;background:#102d3c;border-radius:99px;margin:0 0 25px;overflow:hidden}.progressline span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:.35s}
@media(max-width:850px){.grid,.choices,.market,.stats,.analysis{grid-template-columns:1fr 1fr}.hero:after{opacity:.28;right:-150px}.app{padding:14px}.panel{padding:22px}}
@media(max-width:620px){.grid,.choices,.market,.stats,.analysis{grid-template-columns:1fr}.hero{min-height:520px}.hero:after{right:-105px;top:15px;width:210px;height:210px}.hero h1{font-size:46px;max-width:90%}.top{font-size:11px}.brand{letter-spacing:.8px}.brand:before{width:34px;height:34px}.money{padding:8px 11px}.panel{border-radius:22px}.nav{flex-direction:column-reverse}.nav .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.econbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 20px}
.econbox{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#081b26}
.econbox span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.econbox b{font-size:19px;color:var(--gold2)}
.reserve-good{color:var(--good)!important}.reserve-low{color:var(--bad)!important}
@media(max-width:620px){.econbar{grid-template-columns:1fr}}


/* v5.1 PREMIUM VISUAL LAYER */
:root{

 --line:rgba(171,205,220,.16);--good:#76d0aa;--bad:#ee9292;

*{box-sizing:border-box}

.panel:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.025),transparent 25%,transparent 72%,rgba(215,169,77,.035))}
.kicker{color:var(--gold2);font-size:10px;letter-spacing:2.6px}
.section-title{font-size:clamp(31px,4vw,47px);letter-spacing:-.7px;margin:8px 0 24px}
.hero{min-height:530px;max-width:760px}
.hero h1{font-size:clamp(50px,7vw,86px);letter-spacing:-3.3px;text-shadow:0 12px 50px #000}
.hero p{font-size:18px;line-height:1.75;color:#c4d5dc}

 width:310px;height:310px;right:-390px;top:75px;
 background:

 box-shadow:0 10px 32px rgba(215,169,77,.16);

.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 15px 40px rgba(215,169,77,.25)}

/* v5.2 — visual journey */
body{transition:background-color .45s ease}
body[data-scene] .panel{transition:background .45s ease,border-color .45s ease,box-shadow .45s ease}
body[data-scene] .panel:before{transition:background .45s ease}
body[data-scene="office"] .panel{
 background:linear-gradient(140deg,rgba(10,30,41,.96),rgba(5,17,25,.96));
 box-shadow:0 36px 110px #000b,inset 0 1px 0 #ffffff0d
}
body[data-scene="market"] .panel{
 background:
 radial-gradient(circle at 82% 15%,rgba(70,151,160,.13),transparent 28%),
 linear-gradient(140deg,rgba(8,32,44,.96),rgba(5,17,25,.97))
}
body[data-scene="studio"] .panel{
 background:
 radial-gradient(circle at 82% 18%,rgba(215,169,77,.14),transparent 26%),
 linear-gradient(145deg,rgba(31,27,23,.94),rgba(7,18,24,.97))
}
body[data-scene="art"] .panel{
 background:
 radial-gradient(circle at 78% 20%,rgba(91,89,151,.15),transparent 28%),

}

/* v5.3 — release show */
.release-show{min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.release-count{font-family:Georgia,serif;font-size:clamp(110px,22vw,240px);line-height:.85;color:var(--gold2);text-shadow:0 0 60px rgba(215,169,77,.32);animation:countPop .72s ease both}
.release-word{font-family:Georgia,serif;font-size:clamp(55px,10vw,112px);letter-spacing:-3px;background:linear-gradient(180deg,#fff1bf,#d7a94d);-webkit-background-clip:text;color:transparent;animation:releaseGlow 1.1s ease both}
.release-song{font-size:20px;color:#c7d7dd;margin-top:12px}
.release-live{margin-top:25px;color:#7fa0ad;font:800 10px Arial,sans-serif;letter-spacing:2.5px;text-transform:uppercase}
.stream-counter{font-family:Georgia,serif;font-size:clamp(58px,10vw,105px);letter-spacing:-3px;margin:8px 0;color:#f7fbfc;font-variant-numeric:tabular-nums}
.stream-label{color:#8eabb7;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
.release-disc{width:190px;height:190px;border-radius:50%;margin:15px auto 0;background:repeating-radial-gradient(circle,#090b0c 0 3px,#202326 4px 6px);box-shadow:0 25px 60px #000d,0 0 55px rgba(215,169,77,.12);animation:spin 2.5s linear infinite}
.release-disc:after{content:"VUSTIN SOUND";display:flex;align-items:center;justify-content:center;position:absolute;width:68px;height:68px;border-radius:50%;background:var(--gold);color:#0e3753;font:800 8px Arial,sans-serif;letter-spacing:1px;left:61px;top:61px}
.release-flash{position:absolute;inset:-20%;background:radial-gradient(circle,rgba(243,207,123,.24),transparent 42%);animation:flash 1.2s ease both;pointer-events:none}
.reveal-card{animation:revealUp .55s ease both}
@keyframes countPop{0%{opacity:0;transform:scale(1.35)}35%{opacity:1}100%{opacity:.9;transform:scale(.88)}}
@keyframes releaseGlow{0%{opacity:0;transform:scale(.78);filter:blur(10px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes revealUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}


.sound-toggle{position:fixed;right:22px;bottom:20px;z-index:80;width:48px;height:48px;border-radius:50%;border:1px solid rgba(243,207,123,.3);background:rgba(4,16,24,.82);backdrop-filter:blur(14px);color:var(--gold2);font-size:19px;cursor:pointer;box-shadow:0 12px 35px #0008}

.now-playing{margin-top:13px;color:#8ea9b4;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;animation:pulseAudio 1.5s ease-in-out infinite}
@keyframes pulseAudio{50%{opacity:.48}}

<script>
/* v12.5 — automatic iframe height bridge */
(function(){
  let last=0, timer=null;
  function sendHeight(){
    const de=document.documentElement, b=document.body;
    let bottom=0;
    document.querySelectorAll('body *').forEach(function(el){
      const cs=getComputedStyle(el);
      if(cs.position==='fixed' || cs.display==='none') return;
      const r=el.getBoundingClientRect();
      if(Number.isFinite(r.bottom)) bottom=Math.max(bottom,r.bottom);
    });
    const h=Math.ceil(bottom + window.scrollY + 18);
    if(Math.abs(h-last)>2){
      last=h;
      parent.postMessage({type:'vustin-producer-height',height:h},'*');
    }
  }
  function queue(){
    clearTimeout(timer);
    timer=setTimeout(sendHeight,40);
  }
  addEventListener('load',()=>{sendHeight();setTimeout(sendHeight,250);setTimeout(sendHeight,900)});
  addEventListener('resize',queue);
  if(window.ResizeObserver){
    new ResizeObserver(queue).observe(document.documentElement);
    if(document.body)new ResizeObserver(queue).observe(document.body);
  }
  new MutationObserver(queue).observe(document.documentElement,{subtree:true,childList:true,attributes:true});
})();
</script>


<script>
/* v12.9 — visual feedback for dilemma/decision clicks */
document.addEventListener('click',function(e){
  const el=e.target.closest('[onclick]');
  if(!el) return;
  const txt=(el.textContent||'').trim();
  if(!/Доработать|Выпускать сейчас|Согласиться|Отказаться|Подождать|Рискнуть/i.test(txt)) return;
  const parent=el.parentElement;
  if(parent){
    [...parent.children].forEach(x=>x.classList.remove('selected'));
  }
  el.classList.add('selected');
});
</script>
