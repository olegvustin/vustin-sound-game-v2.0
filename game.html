<script>
let currentPreview=null;
let primedPreview=null;

function previewSrcForSong(song){
 if(!song)return null;
 if(song.preview)return song.preview+(song.preview.includes('?')?'&':'?')+'v=13.10';
 return null;
}
function stopRealPreview(){
 const audios=[currentPreview,primedPreview].filter(Boolean);
 audios.forEach(a=>{try{a.pause();a.currentTime=0}catch(e){}});
 currentPreview=null;primedPreview=null;
}
function primeReleasePreview(){
 if(!soundOn||!state.song)return;
 const src=previewSrcForSong(state.song);
 if(!src)return;
 try{
  if(primedPreview){try{primedPreview.pause()}catch(e){}}
  const a=new Audio(src);
  a.preload='auto';
  a.volume=0.001;
  a.currentTime=0;
  primedPreview=a;
  const promise=a.play();
  if(promise&&promise.then){
   promise.then(()=>{
    try{a.pause();a.currentTime=0;a.volume=.78}catch(e){}
   }).catch(()=>{});
  }
 }catch(e){}
}
function playRealPreview(){
 if(!soundOn||!state.song)return;
 const src=previewSrcForSong(state.song);
 if(!src)return;
 try{
  let a=primedPreview;
  if(!a || !a.src || a.src.indexOf(state.song.preview)===-1){
   a=new Audio(src);a.preload='auto';
  }
  currentPreview=a;primedPreview=null;
  currentPreview.currentTime=0;
  currentPreview.volume=.78;
  const promise=currentPreview.play();
  if(promise&&promise.catch){
   promise.catch(()=>{
    // Fallback: show an explicit user-gesture play control if the browser blocks delayed playback.
    const host=document.querySelector('.now-playing');
    if(host)host.innerHTML=`<button type="button" class="btn" style="padding:10px 16px" onclick="playRealPreview()">▶ СЛУШАТЬ ФРАГМЕНТ</button>`;
   });
  }
 }catch(e){}
}



let demoPreview=null,demoButton=null;
function stopSongDemo(){
 if(demoPreview){try{demoPreview.pause();demoPreview.currentTime=0}catch(e){}demoPreview=null}
 if(demoButton){demoButton.textContent='▶ ПОСЛУШАТЬ ПЕСНЮ';demoButton.classList.remove('playing');demoButton=null}
}
function playSongDemo(ev,id,btn){
 if(ev){ev.stopPropagation();ev.preventDefault()}
 const song=songs.find(x=>x.id===id); if(!song||!song.preview)return;
 if(demoPreview&&demoButton===btn){stopSongDemo();return}
 stopSongDemo(); stopRealPreview();
 try{
  demoButton=btn;btn.textContent='■ ОСТАНОВИТЬ';btn.classList.add('playing');
  demoPreview=new Audio(song.preview+(song.preview.includes('?')?'&':'?')+'v=14.2');
  demoPreview.volume=.78;
  demoPreview.addEventListener('ended',stopSongDemo,{once:true});
  demoPreview.play().catch(()=>{stopSongDemo();toast('Нажми ещё раз, чтобы включить демо')});
 }catch(e){stopSongDemo()}
}
let soundOn=true,audioCtx=null;
function ac(){
 if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
 return audioCtx;
}
function tone(freq=440,dur=.08,type='sine',gain=.025,delay=0){
 if(!soundOn)return;
 try{
  let c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
 }catch(e){}
}
function uiClick(){tone(620,.045,'sine',.012)}
function countdownSound(n){tone(n===1?660:440,.12,'sine',.035);tone(n===1?990:660,.10,'sine',.015,.03)}
function launchSound(){tone(220,.35,'sawtooth',.022);tone(440,.45,'sine',.025,.08);tone(880,.55,'sine',.018,.15)}
function successSound(){tone(523,.22,'sine',.02);tone(659,.22,'sine',.018,.12);tone(784,.34,'sine',.018,.24)}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇';if(!soundOn)stopRealPreview();if(soundOn)uiClick()}
document.addEventListener('click',e=>{if(soundOn&&e.target.closest('.btn,.choice,.card')&&!e.target.closest('#soundToggle'))uiClick()},{capture:true});

function marketImpact(p,t,selectedPromo=[]){
 const matching=selectedPromo.some(idx=>promos[idx]&&promos[idx][2]===t.key);
 const thematic=(t.key==='e'||t.key==='long');
 const affinity=Math.max(0,Math.min(1,((p[t.key]||50)-40)/60));
 // Only selected channels receive the full market effect. Genre/catalog trends have a smaller background effect.
 const exposure=matching?1:(thematic?.32:.08);
 return Math.max(-6,Math.min(6,Math.round(t.boost*.40*exposure*(.45+.55*affinity))));
}

function producerDilemma(){
 const prior=career.lastDilemmaTitle;
 const eligible=producerDilemmas.filter(x=>x.title!==prior);
 const d=eligible[Math.floor(Math.random()*eligible.length)];
 return {...d};
}
function dilemmaOdds(d){
 const p=state.song.p||state.song;
 const ability=d.key==='q'?(p.q||60):(p[d.key]||60);
 const trend=ensureTrend();
 const fit=(ability-60)*.0025;
 const market=d.key===trend.key?trend.boost*.003:0;
 return Math.max(.18,Math.min(.82,d.chance+fit+market));
}
function resolveProducerChoice(d,choice){
 if(choice==='no')return 'Вы сохранили текущую стратегию и отказались от дополнительного риска.';
 if(d.cost>0&&career.cash<d.cost)return 'Недостаточно средств: выберите отказ от предложения.';
 career.cash-=d.cost;state.spent+=Math.max(0,d.cost);
 const ok=Math.random()<dilemmaOdds(d);
 state.industryScore=(state.industryScore||0)+Math.round((ok?d.success:d.fail)*.70);
 if(ok){
  if(d.quality)state.industryScore=Math.min(8,state.industryScore+1);
  if(d.tail)state[d.tail]=Math.min(.12,(state[d.tail]||0)+d.tailValue);
  if(d.rep)state.industryRep=(state.industryRep||0)+d.rep;
 }
 return ok?`Решение сработало: +${Math.round(d.success*.70)} к оценке релиза${d.rep?', репутация также может вырасти':''}.`:`Риск не оправдался: ${Math.round(d.fail*.70)} к оценке релиза.`;
}

function productionReview(s,promoIdx,score,income,profit){
 const good=[],waste=[],better=[], p=s.p;
 const label={v:'короткие видео',vis:'клип / визуал',pl:'плейлисты',radio:'радио',talk:'PR / медиа',q:'таргет'};
 const ranked=promoIdx.map(i=>[i,p[promos[i][2]]]).sort((x,y)=>y[1]-x[1]);

 if(ranked.length&&ranked[0][1]>=75)good.push(`${promos[ranked[0][0]][0]} хорошо совпали с характером песни и получили усиленный коммерческий эффект.`);
 if((state.industryScore||0)>=5)good.push(`Решение в событии «${state.industryTitle}» заметно усилило релиз.`);
 if(score>=80)good.push('Производство, упаковка и продвижение сложились в сильную комбинацию.');
 if(profit>0)good.push(`Релиз вернул вложения и заработал ${fmt(profit)} VS₽ сверх затрат.`);
 if(!good.length)good.push('Релиз состоялся, но ни один фактор не дал выраженного преимущества.');

 ranked.filter(x=>x[1]<65).slice(0,2).forEach(x=>waste.push(`${promos[x[0]][0]} слабо подходят этой песне — такой бюджет почти не создаёт дополнительного охвата.`));
 if((state.industryScore||0)<0)waste.push(`Решение в событии «${state.industryTitle}» снизило потенциал запуска.`);
 if(profit<0&&state.spent>7000)waste.push('Высокий бюджет не окупился: дорогой запуск сам по себе не гарантирует результат.');
 if(!waste.length)waste.push('Явно провальных расходов в этой кампании не обнаружено.');

 const all=promos.map((x,i)=>[i,p[x[2]]]).sort((x,y)=>y[1]-x[1]);
 const unused=all.find(x=>x[1]>=78&&!promoIdx.includes(x[0]));
 if(unused)better.push(`Можно было протестировать ${promos[unused[0]][0]}: потенциал песни здесь ${unused[1]}/100.`);
 if(p.q>=86&&state.studio?.[0]!=='Топ-студия')better.push('Песня чувствительна к качеству записи — более сильная студия могла помочь.');
 if(p.vis>=90&&!promoIdx.includes(0))better.push('У песни очень высокий визуальный потенциал — клип мог стать ключевым активом.');
 if(p.long>=90)better.push('У песни высокий потенциал долгой жизни: полезна стратегия не только на первую неделю.');
 if(!better.length)better.push('Следующий шаг — сохранить сильные решения и точечно проверить другой канал продвижения.');
 return {good:good.slice(0,3),waste:waste.slice(0,3),better:better.slice(0,3)};
}

function advanceCatalog(){
 if(!career.history||!career.history.length){career.lastCatalog=null;return}
 let addStreams=0,addIncome=0,addListeners=0,revivals=[];
 career.history.forEach((h,i)=>{
   let age=Math.max(1,career.releases-i);
   let base=(h.catalogBase||Math.round((h.streams||0)*.075));
   let decay=Math.max(.18,1-age*.075);
   let video=(h.videoTail||0);
   let pr=(h.prTail||0);
   let playlist=(h.playlistTail||0),radio=(h.radioTail||0);
   let tail=base*decay*(1+video*.38+pr*.22+playlist*.28+radio*.20);
   let revival=false;
   // rare deterministic-feeling catalog revival: strong long-life songs are much more likely
   let long=h.long||60;
   if(long>=82 && Math.random()<.16){tail*=2.1;revival=true}
   let st=Math.max(0,Math.round(tail));
   let inc=Math.round(210*Math.pow(Math.max(st,500)/5000,.76));
   let lis=Math.round(st*(.002+long/45000));
   addStreams+=st;addIncome+=inc;addListeners+=lis;
   h.catalogStreams=(h.catalogStreams||0)+st;
   h.catalogIncome=(h.catalogIncome||0)+inc;
   if(revival)revivals.push({song:h.song,streams:st});
 });
 career.cash+=addIncome;
 career.listeners+=addListeners;
 career.catalogIncome=(career.catalogIncome||0)+addIncome;
 career.catalogStreams=(career.catalogStreams||0)+addStreams;
 career.lastCatalog={streams:addStreams,income:addIncome,listeners:addListeners,revivals};
}

const forceMajeurePool=[
 {kind:'bad',title:'Алгоритмы охладели',text:'Рекомендательные системы дали песне меньше показов, чем ожидалось.',stream:.76,income:.94,rep:0},

 {kind:'bad',title:'Плейлист снял трек',text:'Редактор изменил подборку раньше ожидаемого.',stream:.80,income:.95,rep:0},
 {kind:'bad',title:'Клип задержался',text:'Видео вышло позже основного импульса релиза.',stream:.86,income:.96,rep:0},
 {kind:'good',title:'Органический всплеск',text:'Слушатели начали самостоятельно делиться песней.',stream:1.28,income:1.12,rep:1},
 {kind:'good',title:'Пользовательское видео',text:'Неожиданный ролик с песней начал набирать просмотры.',stream:1.35,income:1.10,rep:1},
 {kind:'good',title:'Неожиданная поддержка радио',text:'Ведущий поставил песню вне запланированной ротации.',stream:1.22,income:1.10,rep:1}
];
function rollForceMajeure(){
 let r=Math.random();
 // Most releases are normal; negative surprises are deliberately more common than jackpots.
 if(r<.24)return forceMajeurePool[Math.floor(Math.random()*4)];
 if(r<.36)return forceMajeurePool[4+Math.floor(Math.random()*3)];
 return {kind:'neutral',title:'Без форс-мажоров',text:'Релиз прошёл примерно по плану.',stream:1,income:1,rep:0};
}
function riskFactorForSpend(){
 // Overspending raises execution complexity and makes bad ROI possible.
 let x=Math.max(0,(state.spent-9000)/16000);
 return Math.min(.18,x*.18);
}

function calculateRelease(){
 let s=state.song,p=s.p,notes=[];
 let quality=Math.min(100,p.q*.55+(state.studio?.[2]||0)+(state.arr?.[2]||0)*.7+(state.team.includes(0)?8:0));
 let weighted=[],weights=[1,.85,.65,.4,.3];
 state.promo.forEach(idx=>{
   let pr=promos[idx],val=p[pr[2]];
   if(state.team.includes(2)&&idx===0)val=Math.min(100,val+12);
   if(idx===0)val=Math.min(100,val+career.videoLvl*5);
   if(state.team.includes(3)&&(idx===1||idx===6))val=Math.min(100,val+12);
   if(state.team.includes(4)&&(idx===4||idx===8))val=Math.min(100,val+12);
   if(idx!==0)val=Math.min(100,val+career.marketingLvl*3);
   const t=ensureTrend();
   if(pr[2]===t.key) val=Math.max(0,Math.min(100,val+t.boost*.35));
   val=Math.min(100,val+promoStrategy(idx).visual);
   weighted.push([val,pr[0]]);
 });
 weighted.sort((x,y)=>y[0]-x[0]);
 let denom=weighted.reduce((a,_,i)=>a+(weights[i]||.25),0);
 let fit=weighted.length?weighted.reduce((a,x,i)=>a+x[0]*(weights[i]||.25),0)/denom:30;
 notes.push(['План продвижения',`Выбрано каналов: ${state.promo.length}. Расходы на рекламу: ${fmt(state.promo.reduce((sum,i)=>sum+discountPrice(promos[i][1],i===0?'video':'promo'),0))} VS₽. Обложка и ситуация на рынке учитываются в эффективности выбранных каналов.`]);
 weighted.forEach(x=>notes.push([x[0]>=85?'Сильное решение':x[0]>=70?'Хорошее решение':'Слабое решение',`${x[1]}: соответствие песне ${x[0]}/100.`]));

 let market=state.promo.includes(1)?82:65;
 let industry=Math.max(-7,Math.min(7,state.industryScore||0));
 let coverIdx=covers.findIndex(o=>o[0]===state.cover?.[0]);
 if(coverIdx>=0){
   const coverBonus=coverEffect(s,coverIdx,state.promo);
   industry+=coverBonus;
   notes.push(['Визуальная стратегия',`${covers[coverIdx][0]}: соответствие песне ${coverFit(s,coverIdx)}/100, эффект ${coverBonus>=0?'+':''}${coverBonus} баллов. ${coverIdx===2&&state.promo.some(i=>i===0||i===1)?'Яркий образ поддержал видеопродвижение.':coverIdx===1&&state.promo.includes(4)?'Авторский образ поддержал PR.':'Результат зависит прежде всего от соответствия песне.'}`]);
 }

 let activeTrend=ensureTrend();
 let trendBoost=marketImpact(p,activeTrend,state.promo);
 industry+=trendBoost;
 notes.push(['Рынок и стратегия',`${activeTrend.name}: ${trendBoost>0?'+':''}${trendBoost} баллов. ${state.promo.some(idx=>promos[idx]?.[2]===activeTrend.key)?'Выбранный канал напрямую связан с трендом.':'Прямой канал не выбран: влияние рынка ограничено.'}`]);
 let repBoost=Math.min(75,50+career.rep*.65);
 let score=Math.max(20,Math.min(97,.30*quality+.30*fit+.15*((p.e+p.talk)/2)+.10*market+.05*repBoost+industry));

 let ranges=score<40?[2000,15000]:score<55?[15000,40000]:score<70?[40000,100000]:score<80?[100000,250000]:score<90?[250000,700000]:[700000,1400000];
 let lo=score<40?20:score<55?40:score<70?55:score<80?70:score<90?80:90,span=score<40?20:score<80?15:10;
 let streams=(ranges[0]+(ranges[1]-ranges[0])*((score-lo)/span))*(.9+Math.random()*.2);

 // v9.8: money works only when it matches the song.
 // Expensive channels can now pay back on the right material, but remain wasteful on a poor fit.
 const channelPower=[.42,.26,.24,.30,.28,.22,.13,.12,.12]; // clip, reels, playlists, radio, PR, target
 let activation=0;
 state.promo.forEach(idx=>{
   let val=p[promos[idx][2]];
   if(state.team.includes(2)&&idx===0)val=Math.min(100,val+12);
   if(idx===0)val=Math.min(100,val+career.videoLvl*5);
   if(state.team.includes(3)&&(idx===1||idx===6))val=Math.min(100,val+12);
   if(state.team.includes(4)&&(idx===4||idx===8))val=Math.min(100,val+12);
   if(idx!==0)val=Math.min(100,val+career.marketingLvl*3);
   const t=ensureTrend();
   if(promos[idx][2]===t.key)val=Math.max(0,Math.min(100,val+t.boost*.35));
   val=Math.min(100,val+promoStrategy(idx).visual);
   let match=Math.max(0,Math.min(1,(val-55)/45));
   activation+=(channelPower[idx]||.1)*match*match;
 });
 // diminishing returns stop “buy everything” from becoming the dominant strategy
 activation=Math.min(.48,activation/(1+Math.max(0,state.promo.length-1)*.30));
 let productionLift=1+Math.max(0,quality-72)/520;
 let overspendRisk=riskFactorForSpend();
 let execution=.50+Math.random()*.82-overspendRisk*Math.random();
 // Platform volatility: even a competent campaign can underperform.
 const platformRoll=Math.random();
 if(platformRoll<.11)execution*=.65;
 else if(platformRoll>.94)execution*=1.30; // wider organic reach variance
 streams=Math.max(1000,Math.round(streams*(1+activation+(state.delayedBoost||0)+(state.playlistExtra||0))*productionLift*execution));
 state.forceResult=rollForceMajeure();
 streams=Math.max(1000,Math.round(streams*state.forceResult.stream));
 if(state.goal==='hit')streams=Math.round(streams*1.10);

 // Strong production and song longevity create a larger permanent audience.
 let catalogFactor=1+Math.max(0,quality-72)/180+Math.max(0,p.long-75)/260;
 let loyal=Math.round(streams*(.016+p.e/8500+p.long/12500)*catalogFactor*(state.goal==='fans'?1.22:1));

 // Less concave revenue curve: a successful large release can now justify a major campaign.
 let gross=Math.round(760*Math.pow(Math.max(streams,1000)/10000,0.78)*(state.goal==='profit'?1.15:1));
 gross=Math.round(gross*(state.forceResult?state.forceResult.income:1));
 let partner=Math.round(gross*(state.contract||0)),income=gross-partner;
 // v15.3: reputation rewards consistent, genuinely strong releases, with diminishing returns.
 let repGain=score>=90?6:score>=82?5:score>=74?4:score>=66?3:score>=58?2:score>=48?1:0;
 if(state.goal==='rep'&&score>=62)repGain+=1;
 // A well-executed mid-tier campaign can earn recognition without becoming a hit.
 if(score>=69&&score<76&&quality>=73&&fit>=72)repGain+=1;
 // A credible campaign with an excellent reception earns recognition beyond paid reach.
 if(score>=76&&quality>=72&&fit>=72)repGain+=1;
 if(score>=80&&state.promo.some(i=>promoStrategy(i).value>=80))repGain+=1;
 repGain+=(state.industryRep||0);
 if(state.forceResult?.rep)repGain+=Math.max(-1,Math.min(1,state.forceResult.rep));
 // Recognition grows more slowly once the label becomes established.
 if(career.rep>=32&&score<77)repGain-=1;
 if(career.rep>=40&&score<85)repGain-=1;
 repGain=Math.max(-2,Math.min(7,repGain));
 notes.push(['Рыночная неопределённость',platformRoll<.11?'Алгоритмы ограничили органический охват.':platformRoll>.94?'Платформы неожиданно расширили охват.':'Рыночная реакция близка к обычной.']);
 notes.push(['Репутация',`Качество релиза: ${Math.round(score)}/100; заработано ${repGain} баллов с учётом стратегии и событий.`]);

 let debtPayment=Math.min(income,career.advanceDebt||0);
 income-=debtPayment;career.advanceDebt=Math.max(0,(career.advanceDebt||0)-debtPayment);
 if(debtPayment)notes.push(['Аванс дистрибьютора',`Из дохода удержано ${fmt(debtPayment)} VS₽ для погашения обязательств.`]);
 career.cash+=income;career.listeners+=loyal;career.rep=Math.max(0,career.rep+repGain);career.releases++;career.week++;

 let missed=promos.map((x,i)=>[x,i,p[x[2]]]).filter(x=>!state.promo.includes(x[1])).sort((x,y)=>y[2]-x[2])[0];
 if(missed)notes.push(['Упущенная возможность',`${missed[0][0]} имел потенциал ${missed[2]}/100.`]);
 let dna=songDNA(s);
 notes.unshift(['ДНК песни',`Сильные стороны: ${dna.top.map(x=>x[0]).join(', ')}. Слабее: ${dna.weak.map(x=>x[0]).join(', ')}.`]);
 if(state.industryTitle)notes.unshift(['Событие индустрии',`${state.industryTitle}: ${state.industryDecision}.`]);
 let goalName=(goals.find(g=>g[0]===state.goal)||[])[1]||'—';
 notes.unshift(['Цель релиза',`${goalName}: стратегия учтена в итоговом результате.`]);

 let profit=income-state.spent;
 let producerReview=productionReview(s,state.promo,score,income,profit);
 advanceCatalog();
 let videoTail=state.promo.includes(0)?Math.max(0,(p.vis-60)/40):0;
 let prTail=state.promo.includes(4)?Math.max(0,(p.talk-60)/40):0;
 let radioTail=state.radioTail||0;
 let playlistTail=(state.promo.includes(2)?Math.max(0,(p.pl-60)/40):0)+(state.playlistExtra||0);
 advanceTrend();
 career.history.unshift({song:s.name,songId:s.id,spent:state.spent,streams,income,profit,loyal,score,repGain,
   long:p.long||60,catalogBase:Math.round(streams*(.055+(p.long||60)/2200)),
   videoTail,prTail,playlistTail,radioTail,dilemma:state.dilemmaResult||null,force:state.forceResult||null,catalogStreams:0,catalogIncome:0});
 setTimeout(animateReleaseCounter,80);
 showRelease(streams,loyal,income,partner,score,repGain,notes,profit,producerReview);
}

function newRelease(){
 stopRealPreview();
 if(career.releases>=10)return seasonFinale();
 if(career.cash<2500)return recoveryScreen();
 resetRelease();market();
}
function takeDistributorAdvance(index){
 if(career.advanceDebt>0){toast('Новый аванс доступен только после погашения предыдущего');return}
 const option=advanceOptions[index];if(!option)return advanceScreen();
 career.cash+=option.amount;career.advanceDebt=option.repay;
 saveCareer();resetRelease();market();
}

function season2Ready(){return career.releases>=10}
function season2Level(key){return Math.max(0,Math.min(3,Number((career.season2Infra||{})[key])||0))}
function season2Week(){return Math.max(1,Math.min(13,Number(career.season2Week)||1))}
function season2Cost(project){return Math.max(100,Math.round(project.base*(1-.06*season2Level('office'))))}
function season2Forecast(project){
 const l=season2Level(project.key),aud=Math.min(150000,Math.max(0,career.listeners||0)),rep=Math.min(80,Math.max(0,career.rep||0));
 const cost=season2Cost(project);
 if(project.key==='concert')return {cost,income:Math.round(1800+aud*.045+rep*24+l*1400),listeners:Math.round(100+l*110),rep:1};
 if(project.key==='mastering')return {cost,income:Math.round(1400+l*1150+Math.min(2500,(career.catalogStreams||0)*.003)),listeners:Math.round(350+l*300),rep:1};
 if(project.key==='academy')return {cost,income:Math.round(400+l*360),listeners:Math.round(400+l*500),rep:2+l};
 if(project.key==='media')return {cost,income:Math.round(500+l*450),listeners:Math.round(1800+l*1300+aud*.012),rep:1};
 return {cost,income:Math.round(1400+l*1100+rep*25),listeners:Math.round(350+l*280),rep:1+l};
}

const season2ReleasePlans=[
 {name:'Независимый релиз',cost:1700,quality:0,reach:0,desc:'Экономная запись и продвижение'},
 {name:'Студийный релиз',cost:4200,quality:13,reach:10,desc:'Студийная работа и таргетированная реклама'},
 {name:'Большая премьера',cost:8500,quality:22,reach:24,desc:'Клип, профессиональное производство и широкий охват'}
];
function season2Released(id){return (career.season2Releases||[]).some(x=>x.songId===id)}
function season2ReleaseForecast(song,plan){
 const m=season2Level('mastering'),d=season2Level('digital'),media=season2Level('media'),office=season2Level('office'),academy=season2Level('academy');
 const cost=Math.max(500,Math.round(plan.cost*(1-office*.05-m*.04)));
 const quality=song.p[0]+plan.quality+m*4+academy*2;
 const reach=song.p[2]+plan.reach+media*5+d*3;
 const streams=Math.round(3000+quality*75+reach*115+(career.listeners||0)*.11);
 const income=Math.round(streams*(.12+d*.015));
 const listeners=Math.round(streams*(.065+academy*.004));
 const rep=Math.max(1,Math.round((quality+song.p[1]-145)/17));
 return {cost,streams,income,listeners,rep};
}
document.addEventListener('play',function(e){if(e.target&&e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
function season2SongCatalog(){
 if(!season2Ready())return careerScreen();
 const count=(career.season2Releases||[]).length;
 shell('Сезон 2 · Новые песни','Каталог новых релизов',
 `<div class='card' style='cursor:default'><div class='kicker'>${count}/10 ПЕСЕН ВЫПУЩЕНО · НЕДЕЛЯ ${Math.min(season2Week(),12)}/12</div><p class='desc'>10 новых композиций VUSTIN SOUND. Каждый релиз занимает одну неделю из 12. Инфраструктура снижает расходы и увеличивает результаты. 12-секундные фрагменты доступны для прослушивания. Оригинальные обложки с официального сайта показаны там, где они подтверждены.</p><p class='desc'>Капитал: <b>${fmt(career.cash)} VS₽</b> · Слушатели: <b>${fmt(career.listeners)}</b> · Репутация: <b>${career.rep}</b></p></div>
 <div class='grid'>${season2Songs.map(song=>{let done=season2Released(song.id);return `<div class='card' style='cursor:default'><div class='kicker'>${done?'✓ РЕЛИЗ СОСТОЯЛСЯ':song.genre}</div>${song.cover?`<img class="season2-cover" src="${song.cover}" alt="Обложка песни ${song.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:`<div class="season2-cover-placeholder" aria-label="Обложка пока не найдена"><span>VUSTIN SOUND</span><strong>${song.name}</strong><small>Обложка ожидается</small></div>`}<h3>${song.name}</h3><audio controls preload="none" style="width:100%;max-width:100%;margin:8px 0" src="${song.preview}" aria-label="Фрагмент песни ${song.name}"></audio><p class='desc'>Потенциал качества: ${song.p[0]} · Эмоциональность: ${song.p[1]} · Охват: ${song.p[2]}</p><button class='btn' style='width:100%' ${done||season2Week()>12?'disabled':''} onclick='season2ChooseRelease("${song.id}")'>${done?'УЖЕ ВЫПУЩЕНА':season2Week()>12?'СЕЗОН ЗАВЕРШЁН':'ПОДГОТОВИТЬ РЕЛИЗ →'}</button></div>`}).join('')}</div>
 <div class='nav'><button class='btn alt' onclick='season2Infrastructure()'>← ИНФРАСТРУКТУРА</button></div>`);
}
function season2ChooseRelease(id){
 if(!season2Ready()||season2Week()>12||season2Released(id))return season2SongCatalog();
 const song=season2Songs.find(x=>x.id===id);if(!song)return season2SongCatalog();
 shell('Сезон 2 · Продюсирование',song.name,
 `<p class='desc'>Выбери производственный бюджет. Прогноз рассчитывается по параметрам песни и построенной инфраструктуре. Премьера занимает одну игровую неделю.</p><div class='grid'>${season2ReleasePlans.map((plan,i)=>{const f=season2ReleaseForecast(song,plan);return `<div class='card' style='cursor:default'><div class='kicker'>${plan.name}</div><p class='desc'>${plan.desc}</p><div class='price'>${fmt(f.cost)} VS₽</div><p class='desc'>Прогноз: ${fmt(f.streams)} прослушиваний · ${fmt(f.income)} VS₽ выручки · +${fmt(f.listeners)} слушателей · +${f.rep} репутации.</p><p class='small'>Остаток до поступления выручки: ${fmt(career.cash-f.cost)} VS₽</p><button class='btn' style='width:100%' ${career.cash<f.cost?'disabled':''} onclick='season2PublishSong("${song.id}",${i})'>${career.cash<f.cost?'НЕДОСТАТОЧНО СРЕДСТВ':'ВЫПУСТИТЬ ПЕСНЮ →'}</button></div>`}).join('')}</div><div class='nav'><button class='btn alt' onclick='season2SongCatalog()'>← КАТАЛОГ</button></div>`);
}
function season2PublishSong(id,planIndex){
 if(!season2Ready()||season2Week()>12||season2Released(id))return;
 const song=season2Songs.find(x=>x.id===id),plan=season2ReleasePlans[planIndex];if(!song||!plan)return;
 const f=season2ReleaseForecast(song,plan);if(career.cash<f.cost)return season2ChooseRelease(id);
 career.cash-=f.cost;
 const paid=Math.min(f.income,career.advanceDebt||0);
 career.advanceDebt=Math.max(0,(career.advanceDebt||0)-paid);
 career.cash+=f.income-paid;
 const digital=season2Level('digital')*(450+Math.min(2000,Math.round((career.catalogStreams||0)*.001)));
 const paidDigital=Math.min(digital,career.advanceDebt||0);
 career.advanceDebt=Math.max(0,(career.advanceDebt||0)-paidDigital);
 career.cash+=digital-paidDigital;
 career.listeners+=f.listeners;career.rep=Math.max(0,career.rep+f.rep);
 const week=season2Week();career.season2Week=week+1;
 if(!Array.isArray(career.season2Releases))career.season2Releases=[];
 career.season2Releases.push({songId:id,song:song.name,week,plan:plan.name,...f,debtPaid:paid+paidDigital,digital});
 career.season2Last=`Премьера «${song.name}»: ${fmt(f.streams)} прослушиваний, выручка ${fmt(f.income)} VS₽.`;
 saveCareer();
 shell('Сезон 2 · Премьера состоялась',song.name,
 `<div class='card' style='cursor:default'><div class='kicker'>${plan.name} · НЕДЕЛЯ ${week}</div><div class='stats'><div class='stat'><b>${fmt(f.streams)}</b>прослушиваний</div><div class='stat'><b>${fmt(f.income)}</b>выручка</div><div class='stat'><b>+${fmt(f.listeners)}</b>слушателей</div><div class='stat'><b>+${f.rep}</b>репутация</div></div><p class='desc'>Затраты: ${fmt(f.cost)} VS₽. Дистрибуция: +${fmt(digital)} VS₽. Погашено долга: ${fmt(paid+paidDigital)} VS₽. Текущий капитал: ${fmt(career.cash)} VS₽.</p></div><div class='nav'><button class='btn' onclick='season2SongCatalog()'>К СЛЕДУЮЩЕЙ ПЕСНЕ →</button><button class='btn alt' onclick='season2Infrastructure()'>ИНФРАСТРУКТУРА</button></div>`);
}
function season2Infrastructure(){
 if(!season2Ready())return careerScreen();
 let total=season2Assets.reduce((sum,a)=>sum+season2Level(a.key),0),week=season2Week();
 let projects=season2Projects.map(p=>{let lvl=season2Level(p.key),f=season2Forecast(p),available=lvl>0&&week<=12&&career.cash>=f.cost;return `<div class='card' style='cursor:default'><div class='kicker'>${lvl?'УРОВЕНЬ '+lvl:'НУЖЕН ОБЪЕКТ'}</div><h3>${p.name}</h3><p class='desc'>${p.desc}</p><p class='desc'>Расходы: <b>${fmt(f.cost)} VS₽</b> · Выручка: <b>${fmt(f.income)} VS₽</b> · Новые слушатели: <b>${fmt(f.listeners)}</b> · Репутация: <b>+${f.rep}</b></p><button class='btn' style='width:100%' ${available?'':'disabled'} onclick='runSeason2Project("${p.key}")'>${week>12?'СЕЗОН ЗАВЕРШЁН':lvl?'ПРОВЕСТИ ПРОЕКТ →':'СНАЧАЛА ПОСТРОЙ ОБЪЕКТ'}</button></div>`}).join('');
 shell('Сезон 2 · Инфраструктура','VUSTIN RECORDS · Выход на большую сцену',
 `<div class='card' style='cursor:default'><div class='kicker'>ВТОРОЙ СЕЗОН · НЕДЕЛЯ ${Math.min(week,12)}/12</div><h2>Построй музыкальную экосистему</h2><p class='desc'>Развивай объекты и запускай проекты. Каждый проект или новый релиз занимает одну неделю. Дистрибуция приносит дополнительный доход от каталога каждую неделю. Все результаты сохраняются.</p><div class='stats'><div class='stat'><b>${fmt(career.cash)}</b>VS₽ капитал</div><div class='stat'><b>${fmt(career.listeners)}</b>слушателей</div><div class='stat'><b>${career.rep}</b>репутация</div><div class='stat'><b>${total}/18</b>уровней объектов</div></div>${career.season2Last?`<p class='desc'><b>Последнее событие:</b> ${career.season2Last}</p>`:''}</div>
 <div class='card' style='cursor:default;margin-top:14px'><div class='kicker'>НОВЫЕ РЕЛИЗЫ · СЕЗОН 2</div><h3>10 новых песен VUSTIN SOUND</h3><p class='desc'>${(career.season2Releases||[]).length}/10 выпущено. Каждый релиз занимает одну игровую неделю и использует преимущества построенной инфраструктуры.</p><button class='btn' onclick='season2SongCatalog()'>ОТКРЫТЬ КАТАЛОГ ПЕСЕН →</button></div><div class='kicker' style='margin-top:22px'>СТРОИТЕЛЬСТВО И УЛУЧШЕНИЯ</div><div class='grid' style='margin-top:12px'>${season2Assets.map(a=>{let lvl=season2Level(a.key),max=lvl>=3,cost=max?0:a.costs[lvl];return `<div class='card' style='cursor:default'><div class='kicker'>${a.icon} УРОВЕНЬ ${lvl}/3</div><h3>${a.name}</h3><p class='desc'>${a.desc}</p><div class='price'>${max?'МАКСИМАЛЬНЫЙ УРОВЕНЬ':fmt(cost)+' VS₽'}</div><button class='btn' style='width:100%;margin-top:12px' ${max||career.cash<cost?'disabled':''} onclick='buySeason2Asset("${a.key}")'>${max?'ПОСТРОЕНО':'УЛУЧШИТЬ ДО '+(lvl+1)+' УРОВНЯ'}</button></div>`}).join('')}</div>
 <div class='kicker' style='margin-top:24px'>ПРОЕКТЫ · ОДИН ПРОЕКТ В НЕДЕЛЮ</div><div class='grid' style='margin-top:12px'>${projects}</div>
 <div class='card' style='cursor:default;margin-top:14px'><div class='kicker'>ЭКОНОМИКА СЕЗОНА</div><p class='desc'>Доход дистрибуции за каждую завершённую неделю: <b>${fmt(season2Level('digital')*(450+Math.min(2000,Math.round((career.catalogStreams||0)*.001))))} VS₽</b>. Проекты имеют прозрачный прогноз без случайного результата. По завершении 12 недель можно продолжать улучшать инфраструктуру, но новые проекты и релизы сезона заканчиваются.</p>${week>12?`<h3>Сезон 2 завершён!</h3><p class='desc'>Проведено проектов: ${career.season2ProjectsDone||0}. Капитал: ${fmt(career.cash)} VS₽.</p>`:''}</div>
 <div class='nav'><button class='btn alt' onclick='seasonFinale()'>← ИТОГИ ПЕРВОГО СЕЗОНА</button><button class='btn alt' onclick='developmentScreen()'>ИНФРАСТРУКТУРА СЕЗОНА 1</button></div>`);
}
function buySeason2Asset(key){
 if(!season2Ready())return;
 const a=season2Assets.find(x=>x.key===key);if(!a)return;
 const lvl=season2Level(key);if(lvl>=3)return;
 const cost=a.costs[lvl];if(!Number.isFinite(cost)||career.cash<cost){gameFeel('НЕДОСТАТОЧНО СРЕДСТВ','Нужно накопить капитал');return}
 career.cash-=cost;
 if(!career.season2Infra||typeof career.season2Infra!=='object')career.season2Infra={};
 career.season2Infra[key]=lvl+1;
 saveCareer();season2Infrastructure();
}
function runSeason2Project(key){
 if(!season2Ready()||season2Week()>12||season2Level(key)<1)return;
 const project=season2Projects.find(p=>p.key===key);if(!project)return;
 const f=season2Forecast(project);if(career.cash<f.cost){gameFeel('НЕДОСТАТОЧНО СРЕДСТВ','Нужно накопить капитал');return}
 career.cash-=f.cost;
 let paid=Math.min(f.income,career.advanceDebt||0);
 career.advanceDebt=Math.max(0,(career.advanceDebt||0)-paid);
 career.cash+=f.income-paid;
 const digital=season2Level('digital')*(450+Math.min(2000,Math.round((career.catalogStreams||0)*.001)));
 let catalogDebt=Math.min(digital,career.advanceDebt||0);
 career.advanceDebt=Math.max(0,(career.advanceDebt||0)-catalogDebt);
 career.cash+=digital-catalogDebt;
 career.listeners+=f.listeners;
 career.rep=Math.max(0,career.rep+f.rep);
 career.season2Week=season2Week()+1;
 career.season2ProjectsDone=(career.season2ProjectsDone||0)+1;
 career.season2Last=`${project.name}: выручка ${fmt(f.income)} VS₽, расходы ${fmt(f.cost)} VS₽, доход дистрибуции ${fmt(digital)} VS₽${paid+catalogDebt?', погашение долга '+fmt(paid+catalogDebt)+' VS₽':''}.`;
 if(!Array.isArray(career.season2History))career.season2History=[];
 career.season2History.push({week:career.season2Week-1,key,cost:f.cost,income:f.income,digital,listeners:f.listeners,rep:f.rep,debtPaid:paid+catalogDebt});
 saveCareer();season2Infrastructure();
}

function seasonFinal(){return seasonFinale()}
gameSplash();
</script>

<script>
/* v12.5 — automatic iframe height bridge */
(function(){
  let last=0, timer=null;
  function sendHeight(){
    const de=document.documentElement, b=document.body;
    let bottom=0;
    document.querySelectorAll('body *').forEach(function(el){
      const cs=getComputedStyle(el);
      if(cs.position==='fixed' || cs.display==='none') return;
      const r=el.getBoundingClientRect();
      if(Number.isFinite(r.bottom)) bottom=Math.max(bottom,r.bottom);
    });
    const h=Math.ceil(bottom + window.scrollY + 18);
    if(Math.abs(h-last)>2){
      last=h;
      parent.postMessage({type:'vustin-producer-height',height:h},'*');
    }
  }
  function queue(){
    clearTimeout(timer);
    timer=setTimeout(sendHeight,40);
  }
  addEventListener('load',()=>{sendHeight();setTimeout(sendHeight,250);setTimeout(sendHeight,900)});
  addEventListener('resize',queue);
  if(window.ResizeObserver){
    new ResizeObserver(queue).observe(document.documentElement);
    if(document.body)new ResizeObserver(queue).observe(document.body);
  }
  new MutationObserver(queue).observe(document.documentElement,{subtree:true,childList:true,attributes:true});
})();
</script>


<script>
/* v12.9 — visual feedback for dilemma/decision clicks */
document.addEventListener('click',function(e){
  const el=e.target.closest('[onclick]');
  if(!el) return;
  const txt=(el.textContent||'').trim();
  if(!/Доработать|Выпускать сейчас|Согласиться|Отказаться|Подождать|Рискнуть/i.test(txt)) return;
  const parent=el.parentElement;
  if(parent){
    [...parent.children].forEach(x=>x.classList.remove('selected'));
  }
  el.classList.add('selected');
});
</script>
